name: checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n bin/darklands scripts/install.sh scripts/update.sh
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
